<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELAY — P2P Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #e8ff5a;
    --accent2: #ff5a7e;
    --text: #e8e8e8;
    --muted: #555;
    --you: #e8ff5a;
    --them: #ff5a7e;
    --radius: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* ─── HEADER ─── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  .logo span { color: var(--accent2); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
  }

  .dot.connecting { background: #f5a623; animation: pulse 1s infinite; }
  .dot.connected { background: #4cff91; animation: none; }
  .dot.error { background: var(--accent2); }

  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  /* ─── MAIN LAYOUT ─── */
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 20px;
    background: var(--surface);
    overflow-y: auto;
  }

  .sidebar h2 {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .room-id-box {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 0.75rem;
    word-break: break-all;
    color: var(--accent);
    line-height: 1.5;
    position: relative;
  }

  .copy-btn {
    margin-top: 8px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  .copy-btn:hover { background: var(--accent); color: var(--bg); }

  .or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.7rem;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .join-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    padding: 8px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  .join-input:focus { border-color: var(--accent2); }
  .join-input::placeholder { color: var(--muted); }

  .join-btn {
    width: 100%;
    background: var(--accent2);
    border: none;
    color: var(--bg);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    padding: 9px;
    cursor: pointer;
    text-transform: uppercase;
    transition: opacity 0.2s;
    margin-top: 6px;
  }
  .join-btn:hover { opacity: 0.85; }
  .join-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .info-block {
    border: 1px solid var(--border);
    padding: 12px;
    font-size: 0.68rem;
    line-height: 1.7;
    color: var(--muted);
  }
  .info-block strong { color: var(--accent); font-weight: 400; }

  /* ─── CHAT AREA ─── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 3px;
    animation: msgIn 0.2s ease;
    max-width: 78%;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.you { align-self: flex-end; align-items: flex-end; }
  .msg.them { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .msg.you .msg-meta { color: var(--you); opacity: 0.6; }
  .msg.them .msg-meta { color: var(--them); opacity: 0.6; }

  .msg-bubble {
    padding: 10px 14px;
    font-size: 0.82rem;
    line-height: 1.55;
    word-break: break-word;
  }

  .msg.you .msg-bubble {
    background: var(--you);
    color: var(--bg);
    border-radius: var(--radius) var(--radius) 0 var(--radius);
  }

  .msg.them .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--them);
    color: var(--text);
    border-radius: var(--radius) var(--radius) var(--radius) 0;
  }

  /* System messages */
  .sys-msg {
    align-self: center;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid var(--border);
    animation: msgIn 0.2s ease;
  }

  .typing-indicator {
    align-self: flex-start;
    display: none;
    gap: 5px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    align-items: center;
  }
  .typing-indicator.visible { display: flex; }
  .typing-indicator span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--them);
    animation: typingBounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* ─── INPUT BAR ─── */
  .input-bar {
    display: flex;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--surface);
    border: none;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    padding: 16px 18px;
    outline: none;
    resize: none;
  }
  #msg-input::placeholder { color: var(--muted); }
  #msg-input:disabled { opacity: 0.4; cursor: not-allowed; }

  #send-btn {
    background: var(--accent);
    border: none;
    color: var(--bg);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    padding: 0 24px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #d4eb3c; }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }
  .empty-state .big { font-size: 2.5rem; line-height: 1; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    main { flex-direction: column; }
    .sidebar { padding: 14px; gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">RE<span>LAY</span></div>
  <div class="status-pill">
    <div class="dot" id="dot"></div>
    <span id="status-text">initializing</span>
  </div>
</header>

<main>
  <div class="sidebar">
    <div>
      <h2>Your Room ID</h2>
      <div class="room-id-box" id="my-id">generating…</div>
      <button class="copy-btn" id="copy-link-btn" onclick="copyLink()">Copy shareable link</button>
    </div>

    <div class="or-divider">or</div>

    <div>
      <h2>Join a Room</h2>
      <input class="join-input" id="peer-id-input" placeholder="paste room ID here…" />
      <button class="join-btn" id="join-btn" onclick="joinPeer()">Connect →</button>
    </div>

    <div class="info-block">
      <strong>100% peer-to-peer.</strong><br>
      Messages travel directly between browsers. No server stores your data. Free forever — no account, no bills, no expiry.
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="big">⌁</div>
        <div>share your room ID to start</div>
      </div>
    </div>
    <div class="typing-indicator" id="typing-indicator">
      <span></span><span></span><span></span>
    </div>
    <div class="input-bar">
      <textarea id="msg-input" rows="1" placeholder="type a message… (Enter to send)" disabled></textarea>
      <button id="send-btn" disabled onclick="sendMessage()">Send</button>
    </div>
  </div>
</main>

<script>
  let peer, conn;
  let typingTimer;
  let isTyping = false;

  const dot = document.getElementById('dot');
  const statusText = document.getElementById('status-text');
  const myIdEl = document.getElementById('my-id');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const joinBtn = document.getElementById('join-btn');
  const emptyState = document.getElementById('empty-state');
  const typingIndicator = document.getElementById('typing-indicator');

  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    statusText.textContent = text;
  }

  function initPeer() {
    setStatus('connecting', 'connecting…');
    // Check for room ID in URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomToJoin = urlParams.get('room');

    peer = new Peer(undefined, {
      host: '0.peerjs.com',
      port: 443,
      path: '/',
      secure: true,
    });

    peer.on('open', (id) => {
      myIdEl.textContent = id;
      setStatus('', 'ready — waiting');

      if (roomToJoin && roomToJoin !== id) {
        document.getElementById('peer-id-input').value = roomToJoin;
        joinPeer();
      }
    });

    peer.on('connection', (c) => {
      conn = c;
      setupConn();
      setStatus('connecting', 'connecting…');
    });

    peer.on('error', (err) => {
      setStatus('error', 'error');
      addSystemMsg('⚠ ' + err.type);
    });
  }

  function setupConn() {
    conn.on('open', () => {
      setStatus('connected', 'connected');
      addSystemMsg('✓ connection established — end-to-end P2P');
      emptyState?.remove();
      msgInput.disabled = false;
      sendBtn.disabled = false;
      joinBtn.disabled = true;
    });

    conn.on('data', (data) => {
      if (data.type === 'msg') {
        addMessage(data.text, 'them', data.time);
      } else if (data.type === 'typing') {
        typingIndicator.classList.toggle('visible', data.value);
      } else if (data.type === 'disconnect') {
        addSystemMsg('⊘ peer disconnected');
        setStatus('error', 'disconnected');
        msgInput.disabled = true;
        sendBtn.disabled = true;
      }
    });

    conn.on('close', () => {
      addSystemMsg('⊘ connection closed');
      setStatus('error', 'disconnected');
      msgInput.disabled = true;
      sendBtn.disabled = true;
    });

    conn.on('error', (e) => {
      addSystemMsg('⚠ connection error');
    });
  }

  function joinPeer() {
    const id = document.getElementById('peer-id-input').value.trim();
    if (!id) return;
    setStatus('connecting', 'connecting…');
    conn = peer.connect(id, { reliable: true });
    setupConn();
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !conn || conn.open === false) return;
    const time = now();
    conn.send({ type: 'msg', text, time });
    addMessage(text, 'you', time);
    msgInput.value = '';
    msgInput.style.height = 'auto';
    // Stop typing signal
    if (isTyping) {
      conn.send({ type: 'typing', value: false });
      isTyping = false;
    }
  }

  function addMessage(text, from, time) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + from;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = (from === 'you' ? 'you' : 'them') + ' · ' + time;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMsg(text) {
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function copyLink() {
    const id = myIdEl.textContent;
    const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(id)}`;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copy-link-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy shareable link', 2000);
    });
  }

  // Auto-resize textarea + typing indicator
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';

    if (conn && conn.open) {
      if (!isTyping) {
        isTyping = true;
        conn.send({ type: 'typing', value: true });
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        isTyping = false;
        conn.send({ type: 'typing', value: false });
      }, 1500);
    }
  });

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Notify peer on close
  window.addEventListener('beforeunload', () => {
    if (conn && conn.open) conn.send({ type: 'disconnect' });
  });

  initPeer();
</script>
</body>
</html>
